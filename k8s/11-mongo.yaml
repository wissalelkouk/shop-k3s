apiVersion: v1
kind: Service
metadata: {name: mongo, namespace: shop}
spec:
  clusterIP: None
  selector: {app: mongo}
  ports: [{port: 27017}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: mongo, namespace: shop}
spec:
  serviceName: mongo
  replicas: 1
  selector: {matchLabels: {app: mongo}}
  template:
    metadata: {labels: {app: mongo, tier: db}}
    spec:
      securityContext: {runAsUser: 999, runAsGroup: 999, fsGroup: 999, seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: mongo
        image: mongo:7.0
        ports: [{containerPort: 27017}]
        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          valueFrom: {secretKeyRef: {name: shop-secret, key: MONGO_ROOT_USER}}
        - name: MONGO_INITDB_ROOT_PASSWORD
          valueFrom: {secretKeyRef: {name: shop-secret, key: MONGO_ROOT_PASSWORD}}
        readinessProbe: {tcpSocket: {port: 27017}, initialDelaySeconds: 10, periodSeconds: 10}
        livenessProbe: {tcpSocket: {port: 27017}, initialDelaySeconds: 30, periodSeconds: 20}
        resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: 500m, memory: 768Mi}}
        securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
        volumeMounts: [{name: data, mountPath: /data/db}]
  volumeClaimTemplates:
  - metadata: {name: data}
    spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 1Gi}}}
