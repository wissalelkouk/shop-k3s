apiVersion: v1
kind: ConfigMap
metadata: {name: shop-config, namespace: shop}
data:
  USER_SERVICE_URL: http://user-service
  PRODUCT_SERVICE_URL: http://product-service
  initdb.sql: "CREATE DATABASE orders;"
---
apiVersion: v1
kind: Secret   # demo values; use SealedSecrets/SOPS in real projects, never commit real secrets
metadata: {name: shop-secret, namespace: shop}
type: Opaque
stringData:
  POSTGRES_USER: shop
  POSTGRES_PASSWORD: ChangeMe-pg-123
  MONGO_ROOT_USER: root
  MONGO_ROOT_PASSWORD: ChangeMe-mongo-123
